    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',

    <!-- Firebase Compat SDKs (Auth & Realtime Database ONLY) -->

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #070913;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding-bottom: 90px; /* Safe space for mobile bottom navbar */
        }

        .glass-header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        }

        .btn-gradient:active {
            transform: scale(0.97);
        }

        /* Active Category Card Highlighting */
        .category-card-active {
            border-color: #ec4899 !important;
            background: rgba(236, 72, 153, 0.12) !important;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.2);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-4 {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

    <!-- MAIN CONTENT AREA -->

            <!-- TYPE & LANGUAGE FILTERS BAR -->

                <!-- Language Filter Pills -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar text-[11px] font-medium py-1">
                    <button onclick="setCategoryLangFilter('all')" id="cat-lang-all" class="cat-lang-btn px-3 py-1.5 rounded-lg bg-pink-500/20 text-pink-300 border border-pink-500/40 whitespace-nowrap">

                    <button onclick="setCategoryLangFilter('Bangla')" id="cat-lang-Bangla" class="cat-lang-btn px-3 py-1.5 rounded-lg bg-gray-900 text-gray-400 border border-gray-800 hover:text-white whitespace-nowrap">
                        বাংলা

                        हिंदी

                    <button onclick="setCategoryLangFilter('Banglish')" id="cat-lang-Banglish" class="cat-lang-btn px-3 py-1.5 rounded-lg bg-gray-900 text-gray-400 border border-gray-800 hover:text-white whitespace-nowrap">
                        Banglish

                    <button onclick="setCategoryLangFilter('Hindilish')" id="cat-lang-Hindilish" class="cat-lang-btn px-3 py-1.5 rounded-lg bg-gray-900 text-gray-400 border border-gray-800 hover:text-white whitespace-nowrap">

                    </div>
                    <div class="space-y-2 py-2">

            <!-- LOAD MORE BUTTON CONTAINER -->
            <div id="load-more-container" class="hidden text-center mt-6">

    <!-- MOBILE BOTTOM NAVIGATION BAR -->

        <div class="grid grid-cols-5 h-full items-center text-center">

            <!-- 2. Categories (Active) -->
            <a href="categories.html" class="flex flex-col items-center justify-center gap-1 text-pink-400 font-bold">

            <!-- 5. Profile -->

    <!-- JAVASCRIPT & FIREBASE REALTIME DB LOGIC -->
    <script>
        // =============================================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBFPd0umYUjpFBH08GNhpvjPA00kTh6Y5c",
            authDomain: "unlimited-73d64.firebaseapp.com",
            databaseURL: "https://unlimited-73d64-default-rtdb.firebaseio.com",
            projectId: "unlimited-73d64",
            storageBucket: "unlimited-73d64.firebasestorage.app",
            messagingSenderId: "1089467648940",
            appId: "1:1089467648940:web:2886be4ec3148bee08c809"
        };

        let app, auth, db;
        let currentUser = null;

        // Category Metadata Configuration
        const CATEGORIES_LIST = [
            { name: 'Love', emoji: '❤️', icon: 'fa-heart' },
            { name: 'Sad', emoji: '💔', icon: 'fa-face-sad-tear' },
            { name: 'Breakup', emoji: '🥀', icon: 'fa-heart-crack' },
            { name: 'Attitude', emoji: '😎', icon: 'fa-fire' },
            { name: 'Friendship', emoji: '🫂', icon: 'fa-users' },
            { name: 'Romantic', emoji: '🌙', icon: 'fa-moon' },
            { name: 'Motivation', emoji: '🔥', icon: 'fa-bolt' },
            { name: 'Funny', emoji: '😂', icon: 'fa-face-laugh-beam' },
            { name: 'Alone', emoji: '🖤', icon: 'fa-user-ninja' },
            { name: 'Islamic', emoji: '🤲', icon: 'fa-kaaba' },
            { name: 'Emotional', emoji: '💭', icon: 'fa-cloud-showers-heavy' },
            { name: 'Marriage', emoji: '💍', icon: 'fa-ring' },
            { name: 'Rain', emoji: '🌧️', icon: 'fa-cloud-rain' },
            { name: 'Life', emoji: '🌹', icon: 'fa-seedling' },
            { name: 'Inspirational', emoji: '⭐', icon: 'fa-star' }
        ];

        let selectedCategory = 'Love';
        let allCategoryPosts = []; // All published posts matching selected category
        let filteredCategoryPosts = []; // Posts after type & language filters
        let categoryCountsMap = {};
        
        let currentTypeFilter = 'all';
        let currentLangFilter = 'all';
        let visibleLimit = 10; // Initial limit 10

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    app = firebase.initializeApp(firebaseConfig);
                } else {
                    app = firebase.app();
                }
                auth = firebase.auth();
                db = firebase.database();
            }
        } catch (e) {
            console.warn("Firebase Init Handling:", e.message);
        }

        // =============================================================
        // 2. AUTH STATE LISTENER
        // =============================================================
        if (auth) {
            auth.onAuthStateChanged((user) => {
                currentUser = user;
            });
        }

        // =============================================================
        // 3. INITIALIZATION & URL QUERY PARSER
        // =============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check for URL query param `category` or `cat`
            const urlParams = new URLSearchParams(window.location.search);
            const queryCat = urlParams.get('category') || urlParams.get('cat');

            if (queryCat) {
                const matchedCat = CATEGORIES_LIST.find(c => c.name.toLowerCase() === queryCat.toLowerCase());
                if (matchedCat) {
                    selectedCategory = matchedCat.name;
                }
            }

            renderCategoryGrid();
            loadCategoryDataFromFirebase();
        });

        // =============================================================
        // 4. RENDER CATEGORY GRID CARDS
        // =============================================================
        function renderCategoryGrid() {
            const gridContainer = document.getElementById('category-grid');
            gridContainer.innerHTML = '';

            CATEGORIES_LIST.forEach((cat) => {
                const count = categoryCountsMap[cat.name] || 0;
                const isActive = cat.name.toLowerCase() === selectedCategory.toLowerCase();

                const card = document.createElement('div');
                card.id = `cat-card-${cat.name}`;
                card.className = `glass-card p-3 rounded-2xl text-center cursor-pointer transition-all hover:border-pink-500/50 active:scale-95 ${isActive ? 'category-card-active' : ''}`;
                card.onclick = () => selectCategory(cat.name, true);

                card.innerHTML = `
                    <div class="text-2xl mb-1">${cat.emoji}</div>
                    <h4 class="text-xs font-bold text-white tracking-tight">${cat.name}</h4>
                    <span id="cat-count-${cat.name}" class="text-[10px] text-gray-400 font-semibold mt-0.5 block">
                        ${count}
                    </span>
                `;

                gridContainer.appendChild(card);
            });
        }

        // =============================================================
        // 5. FETCH REALTIME DB DATA & CALCULATE COUNTS
        // =============================================================
        function loadCategoryDataFromFirebase() {
            if (!db) {
                renderErrorState();
                return;
            }

            const contentRef = db.ref('content');

            contentRef.once('value').then((snapshot) => {
                categoryCountsMap = {};
                let allRawPublished = [];

                if (snapshot.exists()) {
                    const rawData = snapshot.val();

                    Object.keys(rawData).forEach((key) => {
                        const item = rawData[key];
                        // Filter ONLY published status
                        if (item && item.status === 'published') {
                            item.contentId = item.contentId || key;

                            // Calculate Counts per Category
                            const catName = item.category || 'Love';
                            categoryCountsMap[catName] = (categoryCountsMap[catName] || 0) + 1;

                            // Calculate Engagement Score
                            const loves = item.loveCount || 0;
                            const views = item.views || 0;
                            const comments = item.commentCount || 0;
                            const publishedAt = item.publishedAt || item.createdAt || 0;
                            const timeScore = publishedAt / 10000000000;

                            item._score = (loves * 5) + (views * 1) + (comments * 3) + timeScore;

                            allRawPublished.push(item);
                        }
                    });
                }

                // Update Grid Count Badges
                CATEGORIES_LIST.forEach(cat => {
                    const el = document.getElementById(`cat-count-${cat.name}`);
                    if (el) el.textContent = categoryCountsMap[cat.name] || 0;
                });

                // Store all raw published items globally for client filtering
                window._allPublishedData = allRawPublished;

                // Load initial selected category content
                selectCategory(selectedCategory, false);

            }).catch((err) => {
                console.error("Firebase Error:", err);
                renderErrorState();
            });
        }

        // =============================================================
        // 6. CATEGORY SELECTION & FILTER HANDLERS
        // =============================================================
        function selectCategory(categoryName, shouldScroll = false) {
            selectedCategory = categoryName;
            visibleLimit = 10; // Reset pagination limit

            // Update Active Grid Styles
            document.querySelectorAll('#category-grid > div').forEach(card => {
                card.classList.remove('category-card-active');
            });
            const activeCard = document.getElementById(`cat-card-${categoryName}`);
            if (activeCard) activeCard.classList.add('category-card-active');

            // Update Banner Information
            const catObj = CATEGORIES_LIST.find(c => c.name.toLowerCase() === categoryName.toLowerCase()) || CATEGORIES_LIST[0];
            document.getElementById('cat-banner-emoji').textContent = catObj.emoji;
            document.getElementById('cat-banner-title').textContent = `${catObj.name} Shayari & Lyrics`;

            // Filter Published Data for selected category
            const rawList = window._allPublishedData || [];
            allCategoryPosts = rawList.filter(item => (item.category || '').toLowerCase() === categoryName.toLowerCase());

            // Engagement Sort Descending
            allCategoryPosts.sort((a, b) => b._score - a._score);

            // Apply Type & Lang filters and render
            applyCategoryFilters();

            // Smooth Scroll to Feed Section if user clicked card
            if (shouldScroll) {
                const section = document.getElementById('selected-category-section');
                if (section) section.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function applyCategoryFilters() {
            let result = [...allCategoryPosts];

            // Type Filter
            if (currentTypeFilter !== 'all') {
                result = result.filter(item => item.type === currentTypeFilter);
            }

            // Language Filter
            if (currentLangFilter !== 'all') {
                result = result.filter(item => item.language === currentLangFilter);
            }

            filteredCategoryPosts = result;

            document.getElementById('cat-total-count').textContent = `${filteredCategoryPosts.length} Posts`;

            if (filteredCategoryPosts.length === 0) {
                renderEmptyState();
                return;
            }

            renderCategoryFeed();
        }

        function setCategoryTypeFilter(type) {
            currentTypeFilter = type;
            visibleLimit = 10;

            document.querySelectorAll('.cat-type-tab').forEach(btn => {
                btn.className = "cat-type-tab py-2 rounded-lg text-gray-400 hover:text-white transition-all";
            });
            const active = document.getElementById(`cat-tab-type-${type}`);
            if (active) active.className = "cat-type-tab py-2 rounded-lg bg-pink-500 text-white transition-all shadow";

            applyCategoryFilters();
        }

        function setCategoryLangFilter(lang) {
            currentLangFilter = lang;
            visibleLimit = 10;

            document.querySelectorAll('.cat-lang-btn').forEach(btn => {
                btn.className = "cat-lang-btn px-3 py-1.5 rounded-lg bg-gray-900 text-gray-400 border border-gray-800 hover:text-white whitespace-nowrap";
            });
            const active = document.getElementById(`cat-lang-${lang}`);
            if (active) active.className = "cat-lang-btn px-3 py-1.5 rounded-lg bg-pink-500/20 text-pink-300 border border-pink-500/40 whitespace-nowrap";

            applyCategoryFilters();
        }

        // =============================================================
        // 7. RENDER CATEGORY CONTENT CARDS & PAGINATION
        // =============================================================
        function renderCategoryFeed() {
            const feedContainer = document.getElementById('category-feed-container');
            const loadMoreBtn = document.getElementById('load-more-container');
            feedContainer.innerHTML = '';

            const sliceToShow = filteredCategoryPosts.slice(0, visibleLimit);

            sliceToShow.forEach((post) => {
                const isLyrics = post.type === 'Lyrics';
                const authorName = `${post.authorFirstName || ''} ${post.authorLastName || ''}`.trim() || 'Poet';
                const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=ec4899&color=fff`;
                const avatar = post.authorProfilePicture || defaultAvatar;
                const langFontClass = getLanguageFontClass(post.language);

                const card = document.createElement('article');
                card.className = "glass-card rounded-2xl p-4 sm:p-5 transition-all duration-200 border border-gray-800/80 hover:border-pink-500/30";

                card.innerHTML = `
                    <!-- Header Author Bar -->
                    <div class="flex items-center justify-between mb-3">
                        <a href="profile.html?uid=${post.authorId}" class="flex items-center gap-2.5 group">
                            <img src="${avatar}" loading="lazy" alt="Author" class="w-9 h-9 rounded-full object-cover border border-pink-500/40 group-hover:scale-105 transition-transform">
                            <div>
                                <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-pink-400 transition-colors leading-tight">
                                    ${escapeHtml(authorName)}
                                </h4>
                                <p class="text-[10px] text-gray-400 font-medium">
                                    @${escapeHtml(post.authorUsername || 'user')}
                                </p>
                            </div>
                        </a>

                        <!-- Type & Language Badges -->
                        <div class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded-md ${isLyrics ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-pink-500/10 text-pink-400 border-pink-500/20'} border text-[10px] font-bold uppercase">
                                ${escapeHtml(post.type || 'Shayari')}
                            </span>
                            <span class="px-2 py-0.5 rounded-md bg-gray-800 text-gray-300 text-[10px] font-semibold">
                                ${escapeHtml(post.language || 'Bangla')}
                            </span>
                        </div>
                    </div>

                    <!-- Lyrics Song & Artist Information -->
                    ${isLyrics ? `
                        <div class="mb-3 px-3 py-2 rounded-xl bg-purple-950/30 border border-purple-500/20 flex items-center justify-between text-xs">
                            <div class="truncate">
                                <span class="text-purple-300 font-bold"><i class="fa-solid fa-music mr-1.5"></i> ${escapeHtml(post.songName || 'Untitled')}</span>
                            </div>
                            <div class="text-gray-400 text-[11px] truncate ml-2">
                                <i class="fa-solid fa-user-pen mr-1"></i> ${escapeHtml(post.artistName || 'Artist')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Content Text Body -->
                    <a href="details.html?id=${post.contentId}" class="block my-3">
                        <p class="text-sm sm:text-base text-gray-200 leading-relaxed font-normal whitespace-pre-line line-clamp-4 ${langFontClass}">
                            ${escapeHtml(post.text || '')}
                        </p>
                    </a>

                    <!-- Footer Reaction Bar -->
                    <div class="pt-3 mt-2 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                        <div class="flex items-center gap-4">
                            <!-- Love Button -->
                            <button onclick="toggleLoveReaction('${post.contentId}')" id="love-btn-${post.contentId}" class="flex items-center gap-1.5 hover:text-pink-500 transition-colors active:scale-90">
                                <i id="love-icon-${post.contentId}" class="fa-regular fa-heart text-base"></i>
                                <span id="love-count-${post.contentId}" class="font-semibold text-xs">${post.loveCount || 0}</span>
                            </button>

                            <!-- Comment Count -->
                            <a href="details.html?id=${post.contentId}" class="flex items-center gap-1.5 hover:text-purple-400 transition-colors">
                                <i class="fa-regular fa-comment text-base"></i>
                                <span class="font-semibold text-xs">${post.commentCount || 0}</span>
                            </a>

                            <!-- Views Count -->
                            <div class="flex items-center gap-1 text-gray-500">
                                <i class="fa-regular fa-eye text-xs"></i>
                                <span class="text-[11px] font-medium">${post.views || 0}</span>
                            </div>
                        </div>

                        <!-- Share & View Full -->
                        <div class="flex items-center gap-3">
                            <button onclick="sharePost('${post.contentId}', '${escapeJsString(post.text)}')" class="p-1.5 hover:text-white transition-colors" title="শেয়ার করুন">
                                <i class="fa-solid fa-share-nodes text-sm"></i>
                            </button>
                            <a href="details.html?id=${post.contentId}" class="text-xs font-bold text-pink-400 hover:text-pink-300 transition-colors flex items-center gap-1">
                                View Full <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;

                feedContainer.appendChild(card);

                // Throttled View Registration
                registerPostView(post.contentId);

                // Sync Reaction State if user is logged in
                checkUserLoveState(post.contentId);
            });

            // Toggle Load More Button Visibility
            if (filteredCategoryPosts.length > visibleLimit) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        function handleLoadMore() {
            visibleLimit += 10;
            renderCategoryFeed();
        }

        // =============================================================
        // 8. REALTIME LOVE REACTION TOGGLE
        // =============================================================
        function checkUserLoveState(contentId) {
            if (!currentUser || !db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            reactionRef.on('value', (snapshot) => {
                const icon = document.getElementById(`love-icon-${contentId}`);
                const btn = document.getElementById(`love-btn-${contentId}`);

                if (snapshot.exists() && snapshot.val()) {
                    if (icon) icon.className = "fa-solid fa-heart text-base text-pink-500 animate-bounce";
                    if (btn) btn.classList.add('text-pink-500');
                } else {
                    if (icon) icon.className = "fa-regular fa-heart text-base";
                    if (btn) btn.classList.remove('text-pink-500');
                }
            });
        }

        function toggleLoveReaction(contentId) {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            if (!db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            const contentLoveRef = db.ref(`content/${contentId}/loveCount`);

            reactionRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    // Remove Reaction
                    reactionRef.remove();
                    contentLoveRef.transaction(count => Math.max(0, (count || 1) - 1));
                } else {
                    // Add Reaction
                    reactionRef.set(true);
                    contentLoveRef.transaction(count => (count || 0) + 1);
                }
            });
        }

        // =============================================================
        // 9. VIEW COUNTER (Session Throttled)
        // =============================================================
        function registerPostView(contentId) {
            if (!db) return;

            const sessionKey = `viewed_${contentId}`;
            if (sessionStorage.getItem(sessionKey)) return;

            sessionStorage.setItem(sessionKey, 'true');

            const viewsRef = db.ref(`content/${contentId}/views`);
            viewsRef.transaction(views => (views || 0) + 1);
        }

        // =============================================================
        // 10. NATIVE SHARE SYSTEM
        // =============================================================
        function sharePost(contentId, text) {
            const shareUrl = `${window.location.origin}/details.html?id=${contentId}`;

            if (navigator.share) {
                navigator.share({
                    title: 'ShayariVerse',
                    text: text ? `"${text.substring(0, 80)}..."` : 'Check out this post on ShayariVerse!',
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Link copied to clipboard!');
                }).catch(() => {
                    alert(`Share Link: ${shareUrl}`);
                });
            }
        }

        // =============================================================
        // 11. EMPTY & ERROR STATES
        // =============================================================
        function renderEmptyState() {
            const feedContainer = document.getElementById('category-feed-container');
            document.getElementById('load-more-container').classList.add('hidden');

            feedContainer.innerHTML = `
                <div class="glass-card rounded-2xl p-8 text-center border border-gray-800">
                    <div class="w-16 h-16 rounded-2xl bg-pink-500/10 text-pink-400 flex items-center justify-center text-2xl mx-auto mb-4">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <h3 class="text-base font-bold text-white mb-1">
                        এই Category-তে এখনো কোনো content publish হয়নি।
                    </h3>
                    <p class="text-xs text-gray-400 max-w-xs mx-auto mb-6 leading-relaxed">
                        তুমিই প্রথম কিছু publish করতে পারো। ❤️
                    </p>
                    <a href="${currentUser ? 'create.html' : 'register.html'}" class="inline-flex items-center gap-2 btn-gradient px-6 py-2.5 rounded-xl text-white font-bold text-xs shadow-lg shadow-pink-500/20 active:scale-95 transition-all">
                        <i class="fa-solid fa-plus"></i> Create Now
                    </a>
                </div>
            `;
        }

        function renderErrorState() {
            const feedContainer = document.getElementById('category-feed-container');
            feedContainer.innerHTML = `
                <div class="glass-card rounded-2xl p-6 text-center border border-red-500/20">
                    <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl mb-2"></i>
                    <h3 class="text-sm font-bold text-white">Content load করা যাচ্ছে না।</h3>
                    <p class="text-xs text-gray-400 mt-1 mb-4">Please check your network connection.</p>
                    <button onclick="loadCategoryDataFromFirebase()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold">
                        Try Again
                    </button>
                </div>
            `;
        }

        // Helper Functions
        function getLanguageFontClass(lang) {
            if (lang === 'Bangla') return 'font-bangla';
            if (lang === 'Hindi') return 'font-hindi';
            return 'font-sans';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJsString(str) {
            if (!str) return '';
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }
    </script>
</body>
</html>
