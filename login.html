<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - ShayariVerse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Bangla&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            500: '#ec4899',
                            600: '#db2777',
                            dark: '#070913',
                            card: '#111827',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        bangla: ['Tiro Bangla', 'serif']
                    }
                }
            }
        }
    </script>

    <!-- Firebase Compat SDKs (App & Realtime Database ONLY) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #070913;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            transition: all 0.2s ease;
        }

        .btn-gradient:active {
            transform: scale(0.98);
        }

        .btn-gradient:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .glow-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        /* Hide Number Spinner */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-4 sm:p-6 relative selection:bg-pink-500 selection:text-white">

    <!-- Background Accent Glows -->
    <div class="glow-bg w-72 h-72 bg-pink-600 -top-10 -left-10"></div>
    <div class="glow-bg w-80 h-80 bg-purple-600 -bottom-10 -right-10"></div>

    <!-- TOP HEADER / BACK NAVIGATION -->
    <header class="w-full max-w-md mx-auto relative z-10 pt-2 pb-4">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-400 hover:text-pink-400 transition-colors py-2 px-1">
            <i class="fa-solid fa-arrow-left text-sm"></i>
            <span>Back to Home</span>
        </a>
    </header>

    <!-- MAIN LOGIN CONTAINER -->
    <main class="w-full max-w-md mx-auto my-auto relative z-10">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl border border-pink-500/20">
            
            <!-- BRAND LOGO & HEADINGS -->
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl btn-gradient mx-auto flex items-center justify-center text-white text-xl font-bold mb-3 shadow-lg shadow-pink-500/20">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">
                    Shayari<span class="text-gradient">Verse</span>
                </h1>
                <p class="text-[10px] text-pink-400 font-semibold uppercase tracking-wider mt-0.5">
                    Shayari • Lyrics • Emotions
                </p>

                <h2 class="text-2xl font-bold text-white mt-5">Welcome Back</h2>
                <p class="text-xs text-gray-400 mt-1">Login to continue to your account</p>
            </div>

            <!-- ALERT / ERROR MESSAGE DISPLAY -->
            <div id="alert-box" class="hidden p-3.5 mb-5 rounded-xl text-xs font-medium border flex items-start gap-2.5 transition-all">
                <i id="alert-icon" class="fa-solid fa-circle-exclamation text-base shrink-0 mt-0.5"></i>
                <span id="alert-message" class="leading-relaxed"></span>
            </div>

            <!-- LOGIN FORM (PHONE + PASSWORD ONLY) -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                
                <!-- Phone Number -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Phone Number</label>
                    <div class="flex items-center gap-2">
                        <!-- Country Code Badge -->
                        <div class="px-3.5 py-3.5 rounded-xl bg-gray-900 border border-gray-800 text-gray-300 font-bold text-xs flex items-center gap-1.5 shrink-0">
                            <span>🇧🇩</span>
                            <span>+880</span>
                        </div>
                        <!-- Number Input -->
                        <div class="relative flex-1">
                            <input type="tel" id="phone-input" placeholder="1712345678" pattern="[0-9]*" inputmode="numeric" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all font-medium">
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password-input" placeholder="Enter your password" class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-4 pr-10 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all font-medium">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1">
                            <i id="pass-toggle-icon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" id="login-btn" class="w-full btn-gradient py-3.5 rounded-xl text-white font-bold text-xs tracking-wider uppercase shadow-lg shadow-pink-500/20 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2">
                    <span id="login-btn-text">LOGIN</span>
                    <i id="login-btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden text-sm"></i>
                </button>
            </form>

            <!-- FOOTER REGISTER LINK -->
            <div class="mt-6 pt-5 border-t border-gray-800/80 text-center text-xs text-gray-400">
                <span>Don't have an account?</span>
                <a href="register.html" class="text-pink-400 font-bold hover:underline ml-1">Create Account</a>
            </div>

        </div>
    </main>

    <!-- FOOTER COPYRIGHT -->
    <footer class="w-full max-w-md mx-auto text-center py-4 relative z-10 text-[11px] text-gray-500">
        &copy; <span id="year-span"></span> ShayariVerse. All rights reserved.
    </footer>

    <!-- JAVASCRIPT & FIREBASE REALTIME DB LOGIC -->
    <script>
        // =============================================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBFPd0umYUjpFBH08GNhpvjPA00kTh6Y5c",
            authDomain: "unlimited-73d64.firebaseapp.com",
            databaseURL: "https://unlimited-73d64-default-rtdb.firebaseio.com",
            projectId: "unlimited-73d64",
            storageBucket: "unlimited-73d64.firebasestorage.app",
            messagingSenderId: "1089467648940",
            appId: "1:1089467648940:web:2886be4ec3148bee08c809"
        };

        let app, db;

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    app = firebase.initializeApp(firebaseConfig);
                } else {
                    app = firebase.app();
                }
                db = firebase.database();
            }
        } catch (e) {
            console.warn("Firebase Init Error:", e.message);
        }

        document.getElementById('year-span').textContent = new Date().getFullYear();

        // Check if already logged in locally
        const activeSessionUid = localStorage.getItem('shayariverse_active_uid');
        if (activeSessionUid && db) {
            db.ref(`users/${activeSessionUid}`).once('value').then(snap => {
                if (snap.exists()) {
                    window.location.href = "home.html";
                }
            });
        }

        // =============================================================
        // 2. TOGGLE PASSWORD VISIBILITY
        // =============================================================
        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('pass-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-sm text-pink-400';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye text-sm text-gray-400';
            }
        }

        // =============================================================
        // 3. BANGLADESH PHONE NORMALIZATION
        // =============================================================
        function normalizeBDPhone(rawPhone) {
            if (!rawPhone) return null;
            let cleaned = rawPhone.trim().replace(/[\s\-\(\)]/g, '');

            if (cleaned.startsWith('+880')) {
                cleaned = cleaned.substring(4);
            } else if (cleaned.startsWith('880')) {
                cleaned = cleaned.substring(3);
            }

            if (cleaned.startsWith('0')) {
                cleaned = cleaned.substring(1);
            }

            // Valid BD format: 10 digits starting with 13-19
            if (/^1[3-9]\d{8}$/.test(cleaned)) {
                return '+880' + cleaned;
            }

            return null;
        }

        // Secure Client-Side Hashing (SHA-256 via Web Crypto API)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + "_shayariverse_salt_v1");
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // =============================================================
        // 4. LOGIN SUBMIT HANDLER
        // =============================================================
        async function handleLoginSubmit(event) {
            event.preventDefault();
            hideAlert();

            const rawPhone = document.getElementById('phone-input').value;
            const password = document.getElementById('password-input').value;

            // Input Validation
            if (!rawPhone || !rawPhone.trim()) {
                showAlert("Phone Number দিন।", "error");
                return;
            }

            if (!password || !password.trim()) {
                showAlert("Password দিন।", "error");
                return;
            }

            const normalizedPhone = normalizeBDPhone(rawPhone);
            if (!normalizedPhone) {
                showAlert("সঠিক Phone Number দিন।", "error");
                return;
            }

            if (!db) {
                showAlert("Login করা যাচ্ছে না। আবার চেষ্টা করুন।", "error");
                return;
            }

            setLoadingState(true);

            try {
                // Step 1: Find Account UID from phoneIndex
                const phoneSnap = await db.ref(`phoneIndex/${normalizedPhone}`).once('value');

                if (!phoneSnap.exists()) {
                    setLoadingState(false);
                    showAlert("এই Phone Number দিয়ে কোনো Account পাওয়া যায়নি।", "error");
                    return;
                }

                const uid = phoneSnap.val();

                // Step 2: Fetch User Record to verify password hash
                const userSnap = await db.ref(`users/${uid}`).once('value');

                if (!userSnap.exists()) {
                    setLoadingState(false);
                    showAlert("এই Phone Number দিয়ে কোনো Account পাওয়া যায়নি।", "error");
                    return;
                }

                const userData = userSnap.val();
                const computedHash = await hashPassword(password);

                // Step 3: Verify Hashed Password
                if (userData.passwordHash && userData.passwordHash === computedHash) {
                    // Password Match -> Create Authenticated Session
                    localStorage.setItem('shayariverse_active_uid', uid);
                    
                    showAlert("Login successful! Redirecting...", "success");

                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 800);

                } else {
                    setLoadingState(false);
                    showAlert("Phone Number অথবা Password সঠিক নয়।", "error");
                }

            } catch (err) {
                console.error("Login Error:", err);
                setLoadingState(false);
                showAlert("Login করা যাচ্ছে না। আবার চেষ্টা করুন।", "error");
            }
        }

        // =============================================================
        // 5. ALERT & UI HELPERS
        // =============================================================
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alert-box');
            const alertMsg = document.getElementById('alert-message');
            const alertIcon = document.getElementById('alert-icon');

            alertMsg.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-300', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');

            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-300');
                alertIcon.className = "fa-solid fa-circle-exclamation text-base shrink-0 mt-0.5 text-red-400";
            } else {
                alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
                alertIcon.className = "fa-solid fa-circle-check text-base shrink-0 mt-0.5 text-emerald-400";
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        function setLoadingState(isLoading) {
            const btn = document.getElementById('login-btn');
            const text = document.getElementById('login-btn-text');
            const spinner = document.getElementById('login-btn-spinner');

            btn.disabled = isLoading;
            if (isLoading) {
                text.textContent = 'Logging in...';
                spinner.classList.remove('hidden');
            } else {
                text.textContent = 'LOGIN';
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
