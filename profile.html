<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - ShayariVerse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Bangla&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            500: '#ec4899',
                            600: '#db2777',
                            dark: '#070913',
                            card: '#111827',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        bangla: ['Tiro Bangla', 'serif'],
                        hindi: ['Hind', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Firebase Compat SDKs (Auth & Realtime Database ONLY) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #070913;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding-bottom: 90px; /* Clearance for mobile bottom navbar */
        }

        .glass-header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        }

        .btn-gradient:active {
            transform: scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col selection:bg-pink-500 selection:text-white">

    <!-- TOP STICKY HEADER -->
    <header class="glass-header fixed top-0 left-0 right-0 z-40 h-16 transition-all duration-200">
        <div class="max-w-2xl mx-auto h-full px-4 flex items-center justify-between">
            
            <!-- Back Button -->
            <button onclick="handleHeaderBack()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-gray-800/60 active:bg-gray-800 transition-colors">
                <i class="fa-solid fa-arrow-left text-base"></i>
            </button>

            <!-- Header Title -->
            <h1 class="text-base font-extrabold text-white tracking-tight">
                প্রোফাইল (Profile)
            </h1>

            <!-- Header Right Menu Options -->
            <div id="header-right-actions">
                <!-- Injected dynamically based on MY_PROFILE vs OTHER_USER -->
            </div>

        </div>
    </header>

    <!-- TOAST FEEDBACK NOTIFICATION -->
    <div id="toast-msg" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-xl bg-pink-500 text-white text-xs font-bold shadow-lg border border-pink-400/30 transition-all duration-300">
        <span id="toast-text">Toast message</span>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="pt-20 px-3 sm:px-4 max-w-2xl mx-auto w-full flex-grow">

        <!-- STATUS / ERROR CONTAINER -->
        <div id="status-container" class="space-y-4">
            
            <!-- Skeleton Loader State -->
            <div id="skeleton-loader" class="glass-card rounded-3xl p-6 text-center animate-pulse space-y-4">
                <div class="w-24 h-24 rounded-full bg-gray-800 mx-auto"></div>
                <div class="h-4 bg-gray-800 rounded w-1/3 mx-auto"></div>
                <div class="h-3 bg-gray-800/60 rounded w-1/4 mx-auto"></div>
                <div class="h-10 bg-gray-800 rounded-xl w-2/3 mx-auto"></div>
            </div>

        </div>

        <!-- PROFILE HEADER CARD (HIDDEN INITIALLY) -->
        <section id="profile-card" class="hidden glass-card rounded-3xl p-5 sm:p-7 border border-pink-500/20 text-center mb-6 relative">
            
            <!-- Avatar Display -->
            <div class="relative w-24 h-24 mx-auto mb-4">
                <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=ec4899&color=fff" class="w-full h-full rounded-full object-cover border-2 border-pink-500 shadow-xl">
                <span id="online-badge" class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-emerald-500 border-2 border-gray-950" title="Active"></span>
            </div>

            <!-- Full Name -->
            <h2 id="profile-full-name" class="text-xl sm:text-2xl font-extrabold text-white leading-tight">
                Full Name
            </h2>

            <!-- Username Box with Copy -->
            <div class="mt-2 inline-flex items-center gap-2 bg-gray-900/90 px-3.5 py-1.5 rounded-xl border border-gray-800 text-xs font-semibold text-gray-300">
                <span id="profile-username-text">@username</span>
                <button onclick="copyProfileUsername()" id="copy-user-btn" class="text-pink-400 hover:text-pink-300 transition-colors" title="Copy Username">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>

            <!-- Bio Text -->
            <p id="profile-bio" class="text-xs sm:text-sm text-gray-400 mt-3 max-w-sm mx-auto italic font-normal">
                Bio unavailable.
            </p>

            <!-- Followers & Following Counters -->
            <div class="grid grid-cols-2 gap-4 my-5 py-3 border-y border-gray-800/80">
                <a id="link-followers" href="#" class="hover:bg-gray-800/40 p-1.5 rounded-xl transition-colors">
                    <span id="count-followers" class="block text-lg font-bold text-white">0</span>
                    <span class="text-xs text-gray-400 font-medium">অনুসরণকারী (Followers)</span>
                </a>
                <a id="link-following" href="#" class="hover:bg-gray-800/40 p-1.5 rounded-xl transition-colors border-l border-gray-800/80">
                    <span id="count-following" class="block text-lg font-bold text-white">0</span>
                    <span class="text-xs text-gray-400 font-medium">অনুসরণ করছেন (Following)</span>
                </a>
            </div>

            <!-- MODE SPECIFIC ACTION BUTTONS -->
            <div id="profile-action-buttons" class="flex flex-wrap items-center justify-center gap-3">
                <!-- Injected via JS based on MY_PROFILE vs OTHER_USER -->
            </div>

        </section>

        <!-- PROFILE CONTENT TABS (Posts, Shayari, Lyrics, Saved) -->
        <section id="profile-tabs-section" class="hidden mb-6">
            <div id="profile-tabs-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-1.5 p-1 bg-gray-900/90 rounded-2xl border border-gray-800 text-center text-xs font-semibold">
                
                <button onclick="switchProfileTab('posts')" id="tab-btn-posts" class="prof-tab-btn py-2.5 rounded-xl bg-pink-500 text-white transition-all shadow">
                    Posts
                </button>
                <button onclick="switchProfileTab('shayari')" id="tab-btn-shayari" class="prof-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all">
                    Shayari
                </button>
                <button onclick="switchProfileTab('lyrics')" id="tab-btn-lyrics" class="prof-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all">
                    Lyrics
                </button>
                <!-- Saved Tab visible ONLY on MY PROFILE -->
                <button onclick="window.location.href='favorites.html'" id="tab-btn-saved" class="prof-tab-btn hidden py-2.5 rounded-xl text-gray-400 hover:text-white transition-all">
                    ❤️ Saved
                </button>

            </div>
        </section>

        <!-- USER PUBLISHED POSTS FEED -->
        <section id="user-posts-section" class="hidden space-y-4">
            
            <div id="user-feed-container" class="space-y-4">
                <!-- User posts injected via JS -->
            </div>

            <!-- Load More Button -->
            <div id="load-more-container" class="hidden text-center mt-6">
                <button onclick="handleLoadMoreUserPosts()" class="px-6 py-3 rounded-xl bg-gray-900 hover:bg-gray-800 text-xs font-bold text-gray-200 border border-gray-800 active:scale-95 transition-all">
                    <i class="fa-solid fa-arrows-rotate mr-1.5 text-pink-400"></i> আরও দেখুন (Load More)
                </button>
            </div>

        </section>

    </main>

    <!-- EDIT PROFILE MODAL (MY PROFILE ONLY) -->
    <div id="edit-profile-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 max-w-md w-full border border-pink-500/30 relative">
            <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                <h3 class="text-base font-extrabold text-white"><i class="fa-solid fa-user-pen text-pink-400 mr-2"></i> Edit Profile</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleSaveProfileEdit(event)" class="space-y-4">
                
                <!-- Avatar Change Option (7-Day Lock Enforced) -->
                <div class="text-center pb-2">
                    <div class="relative w-20 h-20 mx-auto mb-2">
                        <img id="modal-avatar-preview" src="" class="w-full h-full rounded-full object-cover border-2 border-pink-500">
                    </div>
                    
                    <input type="file" id="modal-avatar-input" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleModalAvatarSelected(event)">
                    
                    <button type="button" id="modal-change-pic-btn" onclick="triggerModalAvatarSelect()" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-pink-400 text-xs font-bold transition-all border border-gray-700">
                        Change Profile Picture
                    </button>
                    
                    <!-- 7-Day Lock Notice -->
                    <p id="pic-lock-notice" class="text-[10px] text-amber-400 mt-1.5 hidden">
                        <i class="fa-solid fa-shield-halved mr-1"></i> Profile picture 7 দিন পর পরিবর্তন করা যাবে।
                    </p>
                </div>

                <!-- First & Last Name Inputs -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">First Name</label>
                        <input type="text" id="modal-first-name" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:border-pink-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">Last Name</label>
                        <input type="text" id="modal-last-name" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:border-pink-500 focus:outline-none">
                    </div>
                </div>

                <!-- Bio Textarea -->
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Bio (Max 120 chars)</label>
                    <textarea id="modal-bio" maxlength="120" placeholder="Bio লিখুন..." rows="3" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-pink-500 focus:outline-none resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="save-edit-btn" class="w-full btn-gradient py-3 rounded-xl text-white font-bold text-xs uppercase tracking-wider shadow">
                    Save Changes
                </button>

            </form>
        </div>
    </div>

    <!-- MORE OPTIONS MODAL (OTHER USER PROFILE MODE) -->
    <div id="more-options-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-5 max-w-xs w-full border border-gray-800 space-y-3 text-center">
            <h3 class="text-sm font-bold text-white border-b border-gray-800 pb-2">Options</h3>
            <button onclick="handleReportUser()" class="w-full py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-amber-400 text-xs font-bold border border-gray-800">
                <i class="fa-solid fa-flag mr-1.5"></i> Report User
            </button>
            <button onclick="handleBlockUser()" class="w-full py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-red-400 text-xs font-bold border border-gray-800">
                <i class="fa-solid fa-ban mr-1.5"></i> Block User
            </button>
            <button onclick="closeMoreModal()" class="w-full py-2 text-xs font-semibold text-gray-400 hover:text-white">
                Cancel
            </button>
        </div>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 z-50 h-16 px-4 max-w-md mx-auto md:max-w-lg rounded-t-2xl sm:rounded-t-none">
        <div class="grid grid-cols-5 h-full items-center text-center">
            
            <!-- 1. Home -->
            <a href="home.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[9px] tracking-tight">Home</span>
            </a>

            <!-- 2. Search -->
            <a href="search.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span class="text-[9px] tracking-tight">Search</span>
            </a>

            <!-- 3. Create Button -->
            <a id="nav-create-link" href="register.html" class="flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full btn-gradient flex items-center justify-center text-white shadow-lg shadow-pink-500/30 -mt-5 border-2 border-gray-950 active:scale-95">
                    <i class="fa-solid fa-plus text-lg"></i>
                </div>
                <span class="text-[9px] text-gray-400 tracking-tight mt-0.5">Create</span>
            </a>

            <!-- 4. Favorites -->
            <a href="favorites.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-bookmark text-lg"></i>
                <span class="text-[9px] tracking-tight">Favorites</span>
            </a>

            <!-- 5. Profile (Active) -->
            <a href="profile.html" class="flex flex-col items-center justify-center gap-1 text-pink-400 font-bold">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[9px] tracking-tight">Profile</span>
            </a>

        </div>
    </nav>

    <!-- JAVASCRIPT & FIREBASE REALTIME DB LOGIC -->
    <script>
        // =============================================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBFPd0umYUjpFBH08GNhpvjPA00kTh6Y5c",
            authDomain: "unlimited-73d64.firebaseapp.com",
            databaseURL: "https://unlimited-73d64-default-rtdb.firebaseio.com",
            projectId: "unlimited-73d64",
            storageBucket: "unlimited-73d64.firebasestorage.app",
            messagingSenderId: "1089467648940",
            appId: "1:1089467648940:web:2886be4ec3148bee08c809"
        };

        let app, auth, db;
        let currentUser = null;
        let targetUid = null;
        let isOwnProfile = false;
        let targetProfileData = null;

        // Relationship State
        let isFollowing = false;
        let isFollowedByTarget = false;

        // Posts State
        let rawUserPublishedPosts = [];
        let filteredUserPosts = [];
        let currentTabFilter = 'posts'; // 'posts' | 'shayari' | 'lyrics'
        let visiblePostsLimit = 10;

        // Image Edit State
        let newAvatarBase64 = null;
        let canChangeProfilePicture = true;

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    app = firebase.initializeApp(firebaseConfig);
                } else {
                    app = firebase.app();
                }
                auth = firebase.auth();
                db = firebase.database();
            }
        } catch (e) {
            console.warn("Firebase Init Error:", e.message);
        }

        // =============================================================
        // 2. AUTHENTICATION & URL MODE DETERMINATION
        // =============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryUid = urlParams.get('uid');

            if (auth) {
                auth.onAuthStateChanged((user) => {
                    currentUser = user;
                    
                    const createLink = document.getElementById('nav-create-link');
                    if (createLink) createLink.href = user ? "create.html" : "register.html";

                    // Determine Target UID & Mode
                    if (queryUid) {
                        targetUid = queryUid;
                        if (user && user.uid === queryUid) {
                            isOwnProfile = true;
                        } else {
                            isOwnProfile = false;
                        }
                    } else {
                        if (!user) {
                            window.location.href = "login.html";
                            return;
                        }
                        targetUid = user.uid;
                        isOwnProfile = true;
                    }

                    // Start Loading Profile Data
                    loadProfileHeaderData();
                    loadUserPublishedPosts();
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // =============================================================
        // 3. LOAD PROFILE HEADER & RELATIONSHIP DATA
        // =============================================================
        function loadProfileHeaderData() {
            if (!db || !targetUid) return;

            db.ref(`users/${targetUid}`).once('value').then((snapshot) => {
                document.getElementById('skeleton-loader').classList.add('hidden');
                document.getElementById('status-container').classList.add('hidden');

                if (!snapshot.exists()) {
                    renderProfileNotFoundState();
                    return;
                }

                targetProfileData = snapshot.val();
                
                // Show Profile Card
                document.getElementById('profile-card').classList.remove('hidden');
                document.getElementById('profile-tabs-section').classList.remove('hidden');
                document.getElementById('user-posts-section').classList.remove('hidden');

                const fullName = `${targetProfileData.firstName || ''} ${targetProfileData.lastName || ''}`.trim() || 'User';
                const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=ec4899&color=fff`;
                const avatar = targetProfileData.profilePicture || defaultAvatar;

                // Populate Text & Image
                document.getElementById('profile-avatar').src = avatar;
                document.getElementById('profile-full-name').textContent = fullName;
                document.getElementById('profile-username-text').textContent = `@${targetProfileData.username || 'user'}`;
                document.getElementById('profile-bio').textContent = targetProfileData.bio || (isOwnProfile ? 'Bio লিখুন...' : 'No bio available.');
                
                document.getElementById('count-followers').textContent = targetProfileData.followersCount || 0;
                document.getElementById('count-following').textContent = targetProfileData.followingCount || 0;

                // Set Follower / Following List Links
                document.getElementById('link-followers').href = `followers.html?uid=${targetUid}`;
                document.getElementById('link-following').href = `following.html?uid=${targetUid}`;

                // Setup Header Right Actions & Action Buttons based on Mode
                setupHeaderAndActions();

            }).catch(err => {
                console.error("Error loading profile:", err);
                renderProfileNotFoundState();
            });
        }

        // =============================================================
        // 4. SETUP ACTION BUTTONS (MY_PROFILE vs OTHER_USER)
        // =============================================================
        function setupHeaderAndActions() {
            const headerActions = document.getElementById('header-right-actions');
            const buttonContainer = document.getElementById('profile-action-buttons');
            
            headerActions.innerHTML = '';
            buttonContainer.innerHTML = '';

            if (isOwnProfile) {
                // MY PROFILE MODE
                headerActions.innerHTML = `
                    <button onclick="handleLogout()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-red-400 hover:bg-gray-800 transition-colors" title="Logout">
                        <i class="fa-solid fa-right-from-bracket text-base"></i>
                    </button>
                `;

                buttonContainer.innerHTML = `
                    <button onclick="openEditModal()" class="btn-gradient px-5 py-2.5 rounded-xl text-white font-bold text-xs shadow flex items-center gap-1.5 active:scale-95 transition-all">
                        <i class="fa-solid fa-user-pen"></i> Edit Profile
                    </button>
                    <button onclick="shareProfileLink()" class="px-4 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-pink-400 font-bold text-xs border border-gray-800 flex items-center gap-1.5 transition-all">
                        <i class="fa-solid fa-share-nodes"></i> Share
                    </button>
                    <button onclick="handleLogout()" class="px-4 py-2.5 rounded-xl bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white font-bold text-xs border border-red-500/30 flex items-center gap-1.5 transition-all">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </button>
                `;

                // Show Saved Tab on Own Profile
                document.getElementById('tab-btn-saved').classList.remove('hidden');

            } else {
                // OTHER USER MODE
                headerActions.innerHTML = `
                    <button onclick="openMoreModal()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">
                        <i class="fa-solid fa-ellipsis-vertical text-base"></i>
                    </button>
                `;

                // Check Follower / Following Relationships
                checkRelationshipStatus(buttonContainer);

                // Hide Saved Tab for Other Users
                document.getElementById('tab-btn-saved').classList.add('hidden');
            }
        }

        // =============================================================
        // 5. RELATIONSHIP STATUS & FOLLOW / UNFOLLOW SYSTEM
        // =============================================================
        function checkRelationshipStatus(container) {
            if (!currentUser || !db) return;

            const targetFollowersRef = db.ref(`followers/${targetUid}/${currentUser.uid}`);
            const myFollowersRef = db.ref(`followers/${currentUser.uid}/${targetUid}`);

            Promise.all([
                targetFollowersRef.once('value'),
                myFollowersRef.once('value')
            ]).then(([snapTarget, snapMy]) => {
                isFollowing = snapTarget.exists();
                isFollowedByTarget = snapMy.exists();

                renderRelationshipButton(container);
            });
        }

        function renderRelationshipButton(container) {
            let btnClass = "btn-gradient text-white";
            let btnText = "Follow";
            let btnIcon = "fa-user-plus";

            if (isFollowing) {
                btnClass = "bg-gray-800 text-gray-200 border border-gray-700 hover:border-red-500 hover:text-red-400";
                btnText = "Following";
                btnIcon = "fa-user-check";
            } else if (isFollowedByTarget && !isFollowing) {
                btnClass = "btn-gradient text-white";
                btnText = "Follow Back";
                btnIcon = "fa-user-plus";
            }

            container.innerHTML = `
                <button onclick="toggleFollowRelationship()" class="${btnClass} px-6 py-2.5 rounded-xl font-bold text-xs shadow flex items-center gap-2 active:scale-95 transition-all">
                    <i class="fa-solid ${btnIcon}"></i> <span>${btnText}</span>
                </button>
                <button onclick="shareProfileLink()" class="px-4 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-pink-400 font-bold text-xs border border-gray-800 flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-share-nodes"></i> Share
                </button>
            `;
        }

        function toggleFollowRelationship() {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            if (!db || isOwnProfile) return;

            const targetFollowerKey = `followers/${targetUid}/${currentUser.uid}`;
            const myFollowingKey = `following/${currentUser.uid}/${targetUid}`;

            const targetFollowersCountRef = db.ref(`users/${targetUid}/followersCount`);
            const myFollowingCountRef = db.ref(`users/${currentUser.uid}/followingCount`);

            const updates = {};

            if (isFollowing) {
                // Unfollow Action
                updates[targetFollowerKey] = null;
                updates[myFollowingKey] = null;

                db.ref().update(updates).then(() => {
                    targetFollowersCountRef.transaction(c => Math.max(0, (c || 1) - 1));
                    myFollowingCountRef.transaction(c => Math.max(0, (c || 1) - 1));

                    isFollowing = false;
                    document.getElementById('count-followers').textContent = Math.max(0, parseInt(document.getElementById('count-followers').textContent || '1') - 1);
                    renderRelationshipButton(document.getElementById('profile-action-buttons'));
                    showToast("Unfollowed user");
                });
            } else {
                // Follow / Follow Back Action
                updates[targetFollowerKey] = true;
                updates[myFollowingKey] = true;

                db.ref().update(updates).then(() => {
                    targetFollowersCountRef.transaction(c => (c || 0) + 1);
                    myFollowingCountRef.transaction(c => (c || 0) + 1);

                    isFollowing = true;
                    document.getElementById('count-followers').textContent = parseInt(document.getElementById('count-followers').textContent || '0') + 1;
                    renderRelationshipButton(document.getElementById('profile-action-buttons'));
                    showToast("Following user!");
                });
            }
        }

        // =============================================================
        // 6. LOAD USER PUBLISHED CONTENT & TABS
        // =============================================================
        function loadUserPublishedPosts() {
            if (!db || !targetUid) return;

            db.ref('content').once('value').then((snapshot) => {
                rawUserPublishedPosts = [];

                if (snapshot.exists()) {
                    const rawData = snapshot.val();

                    Object.keys(rawData).forEach(key => {
                        const item = rawData[key];
                        // Filter ONLY status = published & authorId = targetUid
                        if (item && item.status === 'published' && item.authorId === targetUid) {
                            item.contentId = item.contentId || key;
                            rawUserPublishedPosts.push(item);
                        }
                    });
                }

                // Sort newest first
                rawUserPublishedPosts.sort((a, b) => (b.publishedAt || b.createdAt || 0) - (a.publishedAt || a.createdAt || 0));

                switchProfileTab('posts');

            }).catch(err => {
                console.error("Error loading user posts:", err);
            });
        }

        function switchProfileTab(tabName) {
            currentTabFilter = tabName;
            visiblePostsLimit = 10;

            document.querySelectorAll('.prof-tab-btn').forEach(btn => {
                btn.className = "prof-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all";
            });

            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            if (activeBtn) {
                activeBtn.className = "prof-tab-btn py-2.5 rounded-xl bg-pink-500 text-white transition-all shadow";
            }

            // Apply Tab Filters
            if (tabName === 'shayari') {
                filteredUserPosts = rawUserPublishedPosts.filter(p => (p.type || '').toLowerCase() === 'shayari');
            } else if (tabName === 'lyrics') {
                filteredUserPosts = rawUserPublishedPosts.filter(p => (p.type || '').toLowerCase() === 'lyrics');
            } else {
                filteredUserPosts = [...rawUserPublishedPosts];
            }

            renderUserPostsFeed();
        }

        function renderUserPostsFeed() {
            const feedContainer = document.getElementById('user-feed-container');
            const loadMoreBtn = document.getElementById('load-more-container');
            feedContainer.innerHTML = '';

            if (filteredUserPosts.length === 0) {
                renderEmptyPostsState();
                loadMoreBtn.classList.add('hidden');
                return;
            }

            const sliceToShow = filteredUserPosts.slice(0, visiblePostsLimit);

            sliceToShow.forEach(post => {
                const isLyrics = (post.type || '').toLowerCase() === 'lyrics';

                const card = document.createElement('article');
                card.className = "glass-card rounded-2xl p-4 sm:p-5 transition-all duration-200 border border-gray-800 hover:border-pink-500/30";

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2.5">
                        <span class="px-2.5 py-1 rounded-lg ${isLyrics ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-pink-500/10 text-pink-400 border-pink-500/20'} border text-[10px] font-bold uppercase">
                            ${escapeHtml(post.type || 'Shayari')}
                        </span>
                        <div class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded bg-gray-800 text-gray-300 text-[10px] font-semibold">${escapeHtml(post.category || 'General')}</span>
                            <span class="px-2 py-0.5 rounded bg-gray-800 text-gray-300 text-[10px] font-semibold">${escapeHtml(post.language || 'Bangla')}</span>
                        </div>
                    </div>

                    ${isLyrics ? `
                        <div class="mb-2.5 p-2 rounded-xl bg-purple-950/30 border border-purple-500/20 flex items-center justify-between text-xs">
                            <span class="text-purple-300 font-bold truncate"><i class="fa-solid fa-music mr-1"></i> ${escapeHtml(post.songName || '')}</span>
                            <span class="text-gray-400 text-[11px] truncate ml-2"><i class="fa-solid fa-microphone mr-1"></i> ${escapeHtml(post.artistName || '')}</span>
                        </div>
                    ` : ''}

                    <a href="details.html?id=${post.contentId}" class="block my-2">
                        <p class="text-xs sm:text-sm text-gray-200 leading-relaxed line-clamp-3">${escapeHtml(post.text || '')}</p>
                    </a>

                    <div class="pt-3 mt-2 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                        <div class="flex items-center gap-3 text-[11px]">
                            <span><i class="fa-regular fa-heart text-pink-500 mr-1"></i> ${post.loveCount || 0}</span>
                            <span><i class="fa-regular fa-comment text-purple-400 mr-1"></i> ${post.commentCount || 0}</span>
                            <span><i class="fa-regular fa-eye text-blue-400 mr-1"></i> ${post.views || 0}</span>
                        </div>

                        <a href="details.html?id=${post.contentId}" class="btn-gradient px-3 py-1 rounded-lg text-white font-bold text-xs shadow">
                            View
                        </a>
                    </div>
                `;

                feedContainer.appendChild(card);
            });

            if (filteredUserPosts.length > visiblePostsLimit) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        function handleLoadMoreUserPosts() {
            visiblePostsLimit += 10;
            renderUserPostsFeed();
        }

        // =============================================================
        // 7. EDIT PROFILE & 7-DAY PICTURE LOCK LOGIC
        // =============================================================
        function openEditModal() {
            if (!isOwnProfile || !targetProfileData) return;

            document.getElementById('modal-first-name').value = targetProfileData.firstName || '';
            document.getElementById('modal-last-name').value = targetProfileData.lastName || '';
            document.getElementById('modal-bio').value = targetProfileData.bio || '';

            const avatar = targetProfileData.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(targetProfileData.firstName)}&background=ec4899&color=fff`;
            document.getElementById('modal-avatar-preview').src = avatar;

            // Check 7-Day Rule (604800000 ms)
            const lastChanged = targetProfileData.profilePictureChangedAt || 0;
            const now = Date.now();
            const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

            const changeBtn = document.getElementById('modal-change-pic-btn');
            const notice = document.getElementById('pic-lock-notice');

            if (now - lastChanged < SEVEN_DAYS_MS) {
                canChangeProfilePicture = false;
                changeBtn.disabled = true;
                changeBtn.className = "px-3 py-1.5 rounded-xl bg-gray-800/50 text-gray-500 text-xs font-bold border border-gray-800 cursor-not-allowed";
                notice.classList.remove('hidden');
            } else {
                canChangeProfilePicture = true;
                changeBtn.disabled = false;
                changeBtn.className = "px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-pink-400 text-xs font-bold transition-all border border-gray-700 cursor-pointer";
                notice.classList.add('hidden');
            }

            document.getElementById('edit-profile-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-profile-modal').classList.add('hidden');
            newAvatarBase64 = null;
        }

        function triggerModalAvatarSelect() {
            if (!canChangeProfilePicture) return;
            document.getElementById('modal-avatar-input').click();
        }

        function handleModalAvatarSelected(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Canvas Compression
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    newAvatarBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('modal-avatar-preview').src = newAvatarBase64;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleSaveProfileEdit(e) {
            e.preventDefault();
            if (!currentUser || !db || !isOwnProfile) return;

            const firstName = document.getElementById('modal-first-name').value.trim();
            const lastName = document.getElementById('modal-last-name').value.trim();
            const bio = document.getElementById('modal-bio').value.trim();

            const updates = {
                firstName: firstName,
                lastName: lastName,
                bio: bio
            };

            if (newAvatarBase64 && canChangeProfilePicture) {
                updates.profilePicture = newAvatarBase64;
                updates.profilePictureChangedAt = Date.now();
            }

            db.ref(`users/${currentUser.uid}`).update(updates).then(() => {
                closeEditModal();
                showToast("Profile updated successfully!");
                loadProfileHeaderData();
            });
        }

        // =============================================================
        // 8. HELPERS & UTILITIES
        // =============================================================
        function copyProfileUsername() {
            if (!targetProfileData) return;
            const handle = `@${targetProfileData.username || ''}`;
            navigator.clipboard.writeText(handle).then(() => {
                showToast("Username copied!");
            }).catch(() => {
                alert(`Username: ${handle}`);
            });
        }

        function shareProfileLink() {
            const shareUrl = window.location.href;
            const handle = targetProfileData ? `@${targetProfileData.username}` : '';

            if (navigator.share) {
                navigator.share({
                    title: 'ShayariVerse Profile',
                    text: `Check out ${handle} on ShayariVerse!`,
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast("Profile link copied!");
                });
            }
        }

        function handleLogout() {
            if (auth) {
                auth.signOut().then(() => {
                    window.location.href = "login.html";
                });
            }
        }

        function openMoreModal() { document.getElementById('more-options-modal').classList.remove('hidden'); }
        function closeMoreModal() { document.getElementById('more-options-modal').classList.add('hidden'); }

        function handleReportUser() {
            closeMoreModal();
            showToast("Report submitted for review.");
        }

        function handleBlockUser() {
            closeMoreModal();
            showToast("User blocked.");
        }

        function renderProfileNotFoundState() {
            const container = document.getElementById('status-container');
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-8 text-center border border-red-500/20 my-8">
                    <i class="fa-solid fa-user-slash text-red-400 text-4xl mb-3"></i>
                    <h3 class="text-base font-bold text-white mb-2">Profile পাওয়া যায়নি।</h3>
                    <p class="text-xs text-gray-400 mb-6">The requested user profile does not exist.</p>
                    <a href="home.html" class="btn-gradient px-6 py-2.5 rounded-xl text-white font-bold text-xs inline-block shadow">
                        Go Home
                    </a>
                </div>
            `;
        }

        function renderEmptyPostsState() {
            const container = document.getElementById('user-feed-container');
            if (isOwnProfile) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center border border-gray-800 my-4">
                        <i class="fa-solid fa-feather text-pink-400 text-2xl mb-2"></i>
                        <h3 class="text-xs font-bold text-white mb-1">এখনো কোনো post publish করেননি।</h3>
                        <p class="text-[11px] text-gray-400 mb-4">আপনার প্রথম Shayari বা Lyrics publish করুন ❤️</p>
                        <a href="create.html" class="btn-gradient px-5 py-2 rounded-xl text-white text-xs font-bold shadow inline-block">
                            Create
                        </a>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center border border-gray-800 my-4">
                        <p class="text-xs text-gray-400">এখনো কোনো published content নেই।</p>
                    </div>
                `;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 2500);
        }

        function handleHeaderBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = "home.html";
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
