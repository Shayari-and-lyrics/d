    <!-- JAVASCRIPT & FIREBASE REALTIME DB LOGIC -->
    <script>
        // =============================================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBFPd0umYUjpFBH08GNhpvjPA00kTh6Y5c",
            authDomain: "unlimited-73d64.firebaseapp.com",
            databaseURL: "https://unlimited-73d64-default-rtdb.firebaseio.com",
            projectId: "unlimited-73d64",
            storageBucket: "unlimited-73d64.firebasestorage.app",
            messagingSenderId: "1089467648940",
            appId: "1:1089467648940:web:2886be4ec3148bee08c809"
        };

        let app, auth, db;
        let currentUser = null;

        let allPublishedLyrics = []; // Stores valid published lyrics
        let filteredLyrics = []; // After applying category and language filters
        
        let selectedLanguage = 'all';
        let selectedCategory = 'all';
        let latestVisibleLimit = 10;

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    app = firebase.initializeApp(firebaseConfig);
                } else {
                    app = firebase.app();
                }
                auth = firebase.auth();
                db = firebase.database();
            }
        } catch (e) {
            console.warn("Firebase Init Error:", e.message);
        }

        // =============================================================
        // 2. AUTH STATE LISTENER & UI UPDATES
        // =============================================================
        if (auth) {
            auth.onAuthStateChanged((user) => {
                currentUser = user;
                const createBtn = document.getElementById('create-lyrics-btn');
                const bottomCreate = document.getElementById('bottom-create-link');
                const bottomProfile = document.getElementById('bottom-profile-link');

                if (user) {
                    if (createBtn) createBtn.href = "create.html";
                    if (bottomCreate) bottomCreate.href = "create.html";
                    if (bottomProfile) bottomProfile.href = "profile.html";
                } else {
                    if (createBtn) createBtn.href = "register.html";
                    if (bottomCreate) bottomCreate.href = "register.html";
                    if (bottomProfile) bottomProfile.href = "login.html";
                }
            });
        }

        // =============================================================
        // 3. INITIALIZATION & URL QUERY PARSER
        // =============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryCat = urlParams.get('category') || urlParams.get('cat');

            if (queryCat) {
                selectedCategory = queryCat;
                updateCategoryChipsUI();
            }

            loadLyricsFromFirebase();
        });

        // =============================================================
        // 4. FETCH REALTIME DB DATA (TYPE = LYRICS & STATUS = PUBLISHED)
        // =============================================================
        function loadLyricsFromFirebase() {
            if (!db) {
                renderErrorState();
                return;
            }

            const contentRef = db.ref('content');

            contentRef.once('value').then((snapshot) => {
                allPublishedLyrics = [];

                if (snapshot.exists()) {
                    const rawData = snapshot.val();

                    Object.keys(rawData).forEach((key) => {
                        const item = rawData[key];

                        // STRICT FILTER: type = "lyrics", status = "published", REQUIRED songName & artistName
                        if (
                            item &&
                            item.type === 'lyrics' &&
                            item.status === 'published' &&
                            item.songName && item.songName.trim() !== '' &&
                            item.artistName && item.artistName.trim() !== ''
                        ) {
                            item.contentId = item.contentId || key;

                            // Calculate Engagement Score
                            const loves = item.loveCount || 0;
                            const views = item.views || 0;
                            const comments = item.commentCount || 0;
                            const publishedAt = item.publishedAt || item.createdAt || 0;
                            const timeScore = publishedAt / 10000000000;

                            // Engagement Formula: (Love x 5) + (Views x 1) + (Comments x 3) + Recency
                            item._score = (loves * 5) + (views * 1) + (comments * 3) + timeScore;

                            allPublishedLyrics.push(item);
                        }
                    });
                }

                // Apply Filters & Render Feeds
                applyFiltersAndRenderFeeds();

            }).catch((err) => {
                console.error("Firebase Error:", err);
                renderErrorState();
            });
        }

        // =============================================================
        // 5. FILTERING & DUAL FEED GENERATION
        // =============================================================
        function applyFiltersAndRenderFeeds() {
            let result = [...allPublishedLyrics];

            // Language Filter
            if (selectedLanguage !== 'all') {
                result = result.filter(item => item.language === selectedLanguage);
            }

            // Category Filter
            if (selectedCategory !== 'all') {
                result = result.filter(item => (item.category || '').toLowerCase() === selectedCategory.toLowerCase());
            }

            filteredLyrics = result;

            if (filteredLyrics.length === 0) {
                renderEmptyState();
                return;
            }

            // Popular Dataset (Sorted by Engagement Score Descending, Max 10)
            const popularList = [...filteredLyrics].sort((a, b) => b._score - a._score).slice(0, 10);

            // Latest Dataset (Sorted by Published Time Descending)
            const latestList = [...filteredLyrics].sort((a, b) => (b.publishedAt || b.createdAt || 0) - (a.publishedAt || a.createdAt || 0));

            // Render Both Sections
            renderPopularSection(popularList);
            renderLatestSection(latestList);
        }

        function setLanguageFilter(lang) {
            selectedLanguage = lang;
            latestVisibleLimit = 10;

            document.querySelectorAll('.lang-chip').forEach(btn => {
                btn.className = "lang-chip px-3.5 py-2 rounded-xl bg-gray-900 text-gray-400 border border-gray-800 hover:text-white whitespace-nowrap active:scale-95 transition-all";
            });
            const active = document.getElementById(`lang-chip-${lang}`);
            if (active) active.className = "lang-chip px-3.5 py-2 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/40 whitespace-nowrap active:scale-95 transition-all";

            applyFiltersAndRenderFeeds();
        }

        function setCategoryFilter(cat) {
            selectedCategory = cat;
            latestVisibleLimit = 10;
            updateCategoryChipsUI();
            applyFiltersAndRenderFeeds();
        }

        function updateCategoryChipsUI() {
            document.querySelectorAll('.cat-chip').forEach(btn => {
                btn.className = "cat-chip px-3.5 py-2 rounded-xl glass-card text-gray-300 border border-gray-800 hover:text-purple-400 whitespace-nowrap active:scale-95 transition-all";
            });
            const active = document.getElementById(`cat-chip-${selectedCategory}`);
            if (active) {
                active.className = "cat-chip px-3.5 py-2 rounded-xl bg-purple-500 text-white whitespace-nowrap active:scale-95 transition-all shadow";
            }
        }

        // =============================================================
        // 6. RENDER POPULAR & LATEST CARDS
        // =============================================================
        function renderPopularSection(posts) {
            const container = document.getElementById('popular-feed-container');
            document.getElementById('popular-count-badge').textContent = `${posts.length} Items`;
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 italic py-2 text-center">কোনো জনপ্রিয় Lyrics পাওয়া যায়নি।</p>`;
                return;
            }

            posts.forEach(post => {
                container.appendChild(createLyricsCardElement(post));
            });
        }

        function renderLatestSection(posts) {
            const container = document.getElementById('latest-feed-container');
            const loadMoreBtn = document.getElementById('load-more-container');
            document.getElementById('latest-count-badge').textContent = `${posts.length} Items`;
            container.innerHTML = '';

            const sliceToShow = posts.slice(0, latestVisibleLimit);

            if (sliceToShow.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 italic py-2 text-center">কোনো নতুন Lyrics পাওয়া যায়নি।</p>`;
                loadMoreBtn.classList.add('hidden');
                return;
            }

            sliceToShow.forEach(post => {
                container.appendChild(createLyricsCardElement(post));
            });

            if (posts.length > latestVisibleLimit) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        function handleLoadMoreLatest() {
            latestVisibleLimit += 10;
            applyFiltersAndRenderFeeds();
        }

        // =============================================================
        // 7. LYRICS CARD DOM BUILDER
        // =============================================================
        function createLyricsCardElement(post) {
            const authorName = `${post.authorFirstName || ''} ${post.authorLastName || ''}`.trim() || 'Poet';
            const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=8b5cf6&color=fff`;
            const avatar = post.authorProfilePicture || defaultAvatar;
            const langFontClass = getLanguageFontClass(post.language);

            const card = document.createElement('article');
            card.className = "glass-card rounded-2xl p-4 sm:p-5 transition-all duration-200 border border-purple-500/20 hover:border-purple-500/40";

            card.innerHTML = `
                <!-- Author Header Bar -->
                <div class="flex items-center justify-between mb-3">
                    <a href="profile.html?uid=${post.authorId}" class="flex items-center gap-2.5 group">
                        <img src="${avatar}" loading="lazy" alt="Author" class="w-9 h-9 rounded-full object-cover border border-purple-500/40 group-hover:scale-105 transition-transform">
                        <div>
                            <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-purple-400 transition-colors leading-tight">
                                ${escapeHtml(authorName)}
                            </h4>
                            <p class="text-[10px] text-gray-400 font-medium">
                                @${escapeHtml(post.authorUsername || 'user')}
                            </p>
                        </div>
                    </a>

                    <!-- Category & Language Badges -->
                    <div class="flex items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded-md bg-purple-500/10 text-purple-300 border border-purple-500/20 text-[10px] font-bold">
                            ${escapeHtml(post.category || 'General')}
                        </span>
                        <span class="px-2 py-0.5 rounded-md bg-gray-800 text-gray-300 text-[10px] font-semibold">
                            ${escapeHtml(post.language || 'Bangla')}
                        </span>
                    </div>
                </div>

                <!-- Mandatory Song & Artist Banner Box -->
                <div class="mb-3 p-3 rounded-xl bg-purple-950/40 border border-purple-500/30 flex items-center justify-between text-xs">
                    <div class="truncate">
                        <p class="text-purple-300 font-extrabold truncate">
                            <i class="fa-solid fa-music mr-1.5 text-pink-400"></i> ${escapeHtml(post.songName)}
                        </p>
                    </div>
                    <div class="text-gray-300 text-[11px] font-medium truncate ml-2">
                        <i class="fa-solid fa-microphone mr-1 text-purple-400"></i> ${escapeHtml(post.artistName)}
                    </div>
                </div>

                <!-- Lyrics Text Body Preview -->
                <a href="details.html?id=${post.contentId}" class="block my-3">
                    <p class="text-sm sm:text-base text-gray-200 leading-relaxed font-normal whitespace-pre-line line-clamp-4 ${langFontClass}">
                        ${escapeHtml(post.text || '')}
                    </p>
                </a>

                <!-- Card Footer Bar -->
                <div class="pt-3 mt-2 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                    <div class="flex items-center gap-4">
                        <!-- Love Button -->
                        <button onclick="toggleLoveReaction('${post.contentId}')" id="love-btn-${post.contentId}" class="flex items-center gap-1.5 hover:text-pink-500 transition-colors active:scale-90">
                            <i id="love-icon-${post.contentId}" class="fa-regular fa-heart text-base"></i>
                            <span id="love-count-${post.contentId}" class="font-semibold text-xs">${post.loveCount || 0}</span>
                        </button>

                        <!-- Comment Count -->
                        <a href="details.html?id=${post.contentId}" class="flex items-center gap-1.5 hover:text-purple-400 transition-colors">
                            <i class="fa-regular fa-comment text-base"></i>
                            <span class="font-semibold text-xs">${post.commentCount || 0}</span>
                        </a>

                        <!-- Views Count -->
                        <div class="flex items-center gap-1 text-gray-500">
                            <i class="fa-regular fa-eye text-xs"></i>
                            <span class="text-[11px] font-medium">${post.views || 0}</span>
                        </div>
                    </div>

                    <!-- Share & Read More Link -->
                    <div class="flex items-center gap-3">
                        <button onclick="shareLyrics('${post.contentId}', '${escapeJsString(post.songName)}', '${escapeJsString(post.text)}')" class="p-1.5 hover:text-white transition-colors" title="শেয়ার করুন">
                            <i class="fa-solid fa-share-nodes text-sm"></i>
                        </button>
                        <a href="details.html?id=${post.contentId}" class="text-xs font-bold text-purple-400 hover:text-purple-300 transition-colors flex items-center gap-1">
                            আরও পড়ুন <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `;

            // Trigger Realtime View Register
            registerPostView(post.contentId);

            // Sync Reaction State if user logged in
            checkUserLoveState(post.contentId);

            return card;
        }

        // =============================================================
        // 8. REALTIME LOVE REACTION TOGGLE
        // =============================================================
        function checkUserLoveState(contentId) {
            if (!currentUser || !db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            reactionRef.on('value', (snapshot) => {
                const icon = document.getElementById(`love-icon-${contentId}`);
                const btn = document.getElementById(`love-btn-${contentId}`);

                if (snapshot.exists() && snapshot.val()) {
                    if (icon) icon.className = "fa-solid fa-heart text-base text-pink-500 animate-bounce";
                    if (btn) btn.classList.add('text-pink-500');
                } else {
                    if (icon) icon.className = "fa-regular fa-heart text-base";
                    if (btn) btn.classList.remove('text-pink-500');
                }
            });
        }

        function toggleLoveReaction(contentId) {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            if (!db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            const contentLoveRef = db.ref(`content/${contentId}/loveCount`);

            reactionRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    reactionRef.remove();
                    contentLoveRef.transaction(count => Math.max(0, (count || 1) - 1));
                } else {
                    reactionRef.set(true);
                    contentLoveRef.transaction(count => (count || 0) + 1);
                }
            });
        }

        // =============================================================
        // 9. VIEW COUNTER (Session Throttled)
        // =============================================================
        function registerPostView(contentId) {
            if (!db) return;

            const sessionKey = `viewed_${contentId}`;
            if (sessionStorage.getItem(sessionKey)) return;

            sessionStorage.setItem(sessionKey, 'true');

            const viewsRef = db.ref(`content/${contentId}/views`);
            viewsRef.transaction(views => (views || 0) + 1);
        }

        // =============================================================
        // 10. NATIVE SHARE SYSTEM
        // =============================================================
        function shareLyrics(contentId, songName, text) {
            const shareUrl = `${window.location.origin}/details.html?id=${contentId}`;

            if (navigator.share) {
                navigator.share({
                    title: songName ? `Lyrics: ${songName}` : 'LyricsVerse',
                    text: text ? `"${text.substring(0, 80)}..."` : 'Check out this song lyrics!',
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('লিংক কপি হয়েছে');
                }).catch(() => {
                    alert(`Share URL: ${shareUrl}`);
                });
            }
        }

        // =============================================================
        // 11. EMPTY & ERROR STATES
        // =============================================================
        function renderEmptyState() {
            const popularContainer = document.getElementById('popular-feed-container');
            const latestContainer = document.getElementById('latest-feed-container');
            document.getElementById('load-more-container').classList.add('hidden');

            popularContainer.innerHTML = '';
            latestContainer.innerHTML = `
                <div class="glass-card rounded-2xl p-8 text-center border border-gray-800">
                    <div class="w-16 h-16 rounded-2xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-2xl mx-auto mb-4">
                        <i class="fa-solid fa-compact-disc"></i>
                    </div>
                    <h3 class="text-base font-bold text-white mb-1">
                        এখনো কোনো Lyrics publish হয়নি।
                    </h3>
                    <p class="text-xs text-gray-400 max-w-xs mx-auto mb-6 leading-relaxed">
                        তুমিই প্রথম Lyrics publish করতে পারো। 🎵
                    </p>
                    <a href="${currentUser ? 'create.html' : 'register.html'}" class="inline-flex items-center gap-2 btn-gradient px-6 py-2.5 rounded-xl text-white font-bold text-xs shadow-lg shadow-purple-500/20 active:scale-95 transition-all">
                        <i class="fa-solid fa-plus"></i> Lyrics লিখুন
                    </a>
                </div>
            `;
        }

        function renderErrorState() {
            const latestContainer = document.getElementById('latest-feed-container');
            latestContainer.innerHTML = `
                <div class="glass-card rounded-2xl p-6 text-center border border-red-500/20">
                    <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl mb-2"></i>
                    <h3 class="text-sm font-bold text-white">Lyrics load করা যাচ্ছে না।</h3>
                    <p class="text-xs text-gray-400 mt-1 mb-4">Please check your internet connection.</p>
                    <button onclick="loadLyricsFromFirebase()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold">
                        আবার চেষ্টা করুন
                    </button>
                </div>
            `;
        }

        // Helper Functions
        function getLanguageFontClass(lang) {
            if (lang === 'Bangla') return 'font-bangla';
            if (lang === 'Hindi') return 'font-hindi';
            return 'font-sans';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJsString(str) {
            if (!str) return '';
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }
    </script>
</body>
