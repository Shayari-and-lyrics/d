    <!-- Tailwind CSS CDN -->

    <script>
        tailwind.config = {

            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            500: '#ec4899',

                        }

                        sans: ['Plus Jakarta Sans', 'sans-serif'],

    <!-- Firebase Compat SDKs (Auth & Realtime Database ONLY) -->

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #070913;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding-bottom: 90px; /* Clearance for mobile bottom navbar */
        }

        .glass-header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        }

        .btn-gradient:active {
            transform: scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col selection:bg-pink-500 selection:text-white">

            <!-- Header Title -->
            <h1 class="text-base font-extrabold text-white tracking-tight">
                Favorites
            </h1>

            <!-- Search Icon -->
            <a href="search.html" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-gray-800/60 active:bg-gray-800 transition-colors">
                <i class="fa-solid fa-magnifying-glass text-base"></i>
            </a>

        </div>
    </header>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-msg" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-xl bg-pink-500 text-white text-xs font-bold shadow-lg border border-pink-400/30 transition-all duration-300">
        <span id="toast-text">Favorites থেকে সরানো হয়েছে</span>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="pt-20 px-3 sm:px-4 max-w-2xl mx-auto w-full flex-grow">

        <!-- INTRO BANNER -->
        <section class="glass-card rounded-2xl p-4 sm:p-5 mb-5 border border-pink-500/20 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl sm:text-2xl font-extrabold text-white flex items-center gap-2">
                        ❤️ আপনার <span class="text-gradient">Favorites</span>
                    </h2>
                    <p class="text-xs text-gray-400 mt-1">আপনার Save করা Shayari ও Lyrics এখানে থাকবে।</p>
                </div>

                <!-- Saved Counter Badge -->
                <div class="text-right">
                    <span id="saved-total-badge" class="px-3 py-1 rounded-full bg-pink-500/10 text-pink-400 border border-pink-500/20 text-xs font-bold">

            </div>

        <!-- FILTER TABS & SORT CONTROLS -->
        <section class="mb-5 space-y-3">
            
            <!-- Type Tabs: All / Shayari / Lyrics -->
            <div class="grid grid-cols-3 gap-1.5 p-1 bg-gray-900/90 rounded-2xl border border-gray-800 text-center text-xs font-semibold">
                <button onclick="setFavoritesTypeTab('all')" id="fav-tab-all" class="fav-tab-btn py-2.5 rounded-xl bg-pink-500 text-white transition-all shadow">
                    ❤️ All
                </button>
                <button onclick="setFavoritesTypeTab('shayari')" id="fav-tab-shayari" class="fav-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all">
                    📜 Shayari
                </button>
                <button onclick="setFavoritesTypeTab('lyrics')" id="fav-tab-lyrics" class="fav-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all">
                    🎵 Lyrics
                </button>
            </div>

            <!-- Sort Bar -->
            <div class="flex items-center justify-between text-xs px-1">
                <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">সাজান (Sort):</span>
                <div class="flex items-center gap-2 text-[11px] font-semibold">
                    <button onclick="setFavoritesSort('recent')" id="sort-recent" class="text-pink-400 font-bold">🕐 Recently Saved</button>
                    <span class="text-gray-700">|</span>
                    <button onclick="setFavoritesSort('popular')" id="sort-popular" class="text-gray-400 hover:text-white">🔥 Popular</button>
                    <span class="text-gray-700">|</span>
                    <button onclick="setFavoritesSort('latest')" id="sort-latest" class="text-gray-400 hover:text-white">🆕 Latest</button>
                </div>
            </div>

        </section>

        <!-- FAVORITES FEED CONTAINER -->
        <section id="favorites-feed-container" class="space-y-4">
            
            <!-- Skeleton Loader -->
            <div id="skeleton-loader" class="glass-card rounded-2xl p-5 space-y-4 animate-pulse">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-800"></div>
                    <div class="space-y-1.5 flex-1">
                        <div class="h-3 bg-gray-800 rounded w-1/3"></div>
                        <div class="h-2.5 bg-gray-800/60 rounded w-1/4"></div>
                    </div>
                </div>
                <div class="space-y-2 py-2">
                    <div class="h-3 bg-gray-800 rounded w-full"></div>
                    <div class="h-3 bg-gray-800 rounded w-3/4"></div>
                </div>
            </div>

        </section>

        <!-- FLOATING QUICK CREATE ACTION BUTTON -->
        <a href="create.html" class="fixed bottom-20 right-4 z-40 btn-gradient px-4 py-3 rounded-full text-white text-xs font-bold shadow-2xl flex items-center gap-2 active:scale-95 transition-transform border border-pink-400/30">
            <i class="fa-solid fa-pen-nib"></i>
            <span>✍️ Create</span>
        </a>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 z-50 h-16 px-4 max-w-md mx-auto md:max-w-lg rounded-t-2xl sm:rounded-t-none">
        <div class="grid grid-cols-5 h-full items-center text-center">
            
            <!-- 1. Home -->
            <a href="home.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[9px] tracking-tight">Home</span>
            </a>

            <!-- 2. Search -->
            <a href="search.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span class="text-[9px] tracking-tight">Search</span>
            </a>

            <!-- 3. Create Button -->
            <a href="create.html" class="flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full btn-gradient flex items-center justify-center text-white shadow-lg shadow-pink-500/30 -mt-5 border-2 border-gray-950 active:scale-95">
                    <i class="fa-solid fa-plus text-lg"></i>
                </div>
                <span class="text-[9px] text-gray-400 tracking-tight mt-0.5">Create</span>
            </a>

            <!-- 4. Favorites (Active) -->
            <a href="favorites.html" class="flex flex-col items-center justify-center gap-1 text-pink-400 font-bold">
                <i class="fa-solid fa-bookmark text-lg"></i>
                <span class="text-[9px] tracking-tight">Favorites</span>
            </a>

            <!-- 5. Profile -->
            <a href="profile.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[9px] tracking-tight">Profile</span>
            </a>

        </div>
    </nav>

    <!-- JAVASCRIPT & FIREBASE REALTIME DB LOGIC -->
    <script>
        // =============================================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // =============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBFPd0umYUjpFBH08GNhpvjPA00kTh6Y5c",
            authDomain: "unlimited-73d64.firebaseapp.com",
            databaseURL: "https://unlimited-73d64-default-rtdb.firebaseio.com",
            projectId: "unlimited-73d64",
            storageBucket: "unlimited-73d64.firebasestorage.app",
            messagingSenderId: "1089467648940",
            appId: "1:1089467648940:web:2886be4ec3148bee08c809"
        };

        let app, auth, db;
        let currentUser = null;

        let userFavoriteItems = []; // List of fetched post objects
        let activeTypeTab = 'all'; // 'all' | 'shayari' | 'lyrics'
        let activeSortOption = 'recent'; // 'recent' | 'popular' | 'latest'

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    app = firebase.initializeApp(firebaseConfig);
                } else {
                    app = firebase.app();
                }
                auth = firebase.auth();
                db = firebase.database();
            }
        } catch (e) {
            console.warn("Firebase Init Handling:", e.message);
        }

        // =============================================================
        // 2. AUTHENTICATION CHECK
        // =============================================================
        if (auth) {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    // Redirect to login if unauthenticated
                    window.location.href = "login.html";
                    return;
                }
                currentUser = user;
                loadUserFavorites(user.uid);
            });
        } else {
            window.location.href = "login.html";
        }

        // =============================================================
        // 3. LOAD USER FAVORITES FROM FIREBASE REALTIME DB
        // =============================================================
        function loadUserFavorites(uid) {
            if (!db) {
                renderErrorState();
                return;
            }

            const favRef = db.ref(`favorites/${uid}`);

            favRef.on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    userFavoriteItems = [];
                    document.getElementById('saved-total-badge').textContent = 'Saved: 0';
                    renderEmptyState('all');
                    return;
                }

                const favData = snapshot.val();
                const favKeys = Object.keys(favData);

                document.getElementById('saved-total-badge').textContent = `Saved: ${favKeys.length}`;

                // Fetch content for each saved ID
                const fetchPromises = favKeys.map(id => {
                    const savedMeta = favData[id];
                    const savedAt = (typeof savedMeta === 'object' && savedMeta.savedAt) ? savedMeta.savedAt : 0;

                    return db.ref(`content/${id}`).once('value').then(snap => {
                        if (snap.exists()) {
                            const post = snap.val();
                            post.contentId = post.contentId || id;
                            post._savedAt = savedAt;
                            return { isAvailable: true, post: post };
                        } else {
                            // Saved item deleted/missing
                            return { isAvailable: false, contentId: id, _savedAt: savedAt };
                        }
                    });
                });

                Promise.all(fetchPromises).then(results => {
                    userFavoriteItems = results;
                    applyTabFilterAndRender();
                }).catch(err => {
                    console.error("Error loading favorites:", err);
                    renderErrorState();
                });
            });
        }

        // =============================================================
        // 4. FILTERING & SORTING LOGIC
        // =============================================================
        function applyTabFilterAndRender() {
            let items = [...userFavoriteItems];

            // Filter by Type
            if (activeTypeTab !== 'all') {
                items = items.filter(item => {
                    if (!item.isAvailable) return true; // Keep unavailable cards in 'all' or filtered view
                    return (item.post.type || '').toLowerCase() === activeTypeTab.toLowerCase();
                });
            }

            if (items.length === 0) {
                renderEmptyState(activeTypeTab);
                return;
            }

            // Apply Sorting
            items.sort((a, b) => {
                if (activeSortOption === 'recent') {
                    return (b._savedAt || 0) - (a._savedAt || 0);
                } else if (activeSortOption === 'popular') {
                    const scoreA = calculateScore(a.post);
                    const scoreB = calculateScore(b.post);
                    return scoreB - scoreA;
                } else if (activeSortOption === 'latest') {
                    const timeA = a.post ? (a.post.publishedAt || a.post.createdAt || 0) : 0;
                    const timeB = b.post ? (b.post.publishedAt || b.post.createdAt || 0) : 0;
                    return timeB - timeA;
                }
                return 0;
            });

            renderFavoritesFeed(items);
        }

        function calculateScore(post) {
            if (!post) return 0;
            const loves = post.loveCount || 0;
            const views = post.views || 0;
            const comments = post.commentCount || 0;
            const publishedAt = post.publishedAt || post.createdAt || 0;
            return (loves * 5) + (views * 1) + (comments * 3) + (publishedAt / 10000000000);
        }

        function setFavoritesTypeTab(tab) {
            activeTypeTab = tab;
            document.querySelectorAll('.fav-tab-btn').forEach(btn => {
                btn.className = "fav-tab-btn py-2.5 rounded-xl text-gray-400 hover:text-white transition-all";
            });
            const active = document.getElementById(`fav-tab-${tab}`);
            if (active) active.className = "fav-tab-btn py-2.5 rounded-xl bg-pink-500 text-white transition-all shadow";

            applyTabFilterAndRender();
        }

        function setFavoritesSort(sort) {
            activeSortOption = sort;
            document.getElementById('sort-recent').className = sort === 'recent' ? "text-pink-400 font-bold" : "text-gray-400 hover:text-white";
            document.getElementById('sort-popular').className = sort === 'popular' ? "text-pink-400 font-bold" : "text-gray-400 hover:text-white";
            document.getElementById('sort-latest').className = sort === 'latest' ? "text-pink-400 font-bold" : "text-gray-400 hover:text-white";

            applyTabFilterAndRender();
        }

        // =============================================================
        // 5. RENDER FAVORITES FEED CARDS
        // =============================================================
        function renderFavoritesFeed(items) {
            const feedContainer = document.getElementById('favorites-feed-container');
            feedContainer.innerHTML = '';

            items.forEach(item => {
                // Render Unavailable Card if post was deleted or is draft
                if (!item.isAvailable || (item.post && item.post.status !== 'published')) {
                    const unavailableCard = document.createElement('div');
                    unavailableCard.id = `fav-card-${item.contentId}`;
                    unavailableCard.className = "glass-card rounded-2xl p-4 flex items-center justify-between border border-red-500/30 bg-red-500/5";
                    unavailableCard.innerHTML = `
                        <div class="flex items-center gap-2.5 text-xs text-red-300 font-medium">
                            <i class="fa-solid fa-circle-exclamation text-base text-red-400"></i>
                            <span>এই content আর available নেই।</span>
                        </div>
                        <button onclick="removeFavoriteItem('${item.contentId}')" class="px-3 py-1.5 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white text-xs font-bold transition-all border border-red-500/40">
                            Remove
                        </button>
                    `;
                    feedContainer.appendChild(unavailableCard);
                    return;
                }

                // Render Valid Published Content Card
                const post = item.post;
                const isLyrics = (post.type || '').toLowerCase() === 'lyrics';
                const authorName = `${post.authorFirstName || ''} ${post.authorLastName || ''}`.trim() || 'Poet';
                const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=ec4899&color=fff`;
                const avatar = post.authorProfilePicture || defaultAvatar;

                const card = document.createElement('article');
                card.id = `fav-card-${post.contentId}`;
                card.className = "glass-card rounded-2xl p-4 sm:p-5 transition-all duration-200 border border-gray-800 hover:border-pink-500/30";

                card.innerHTML = `
                    <!-- Author Header -->
                    <div class="flex items-center justify-between mb-3">
                        <a href="profile.html?uid=${post.authorId}" class="flex items-center gap-2.5 group">
                            <img src="${avatar}" loading="lazy" alt="Author" class="w-9 h-9 rounded-full object-cover border border-pink-500/40 group-hover:scale-105 transition-transform">
                            <div>
                                <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-pink-400 transition-colors leading-tight">
                                    ${escapeHtml(authorName)}
                                </h4>
                                <p class="text-[10px] text-gray-400 font-medium">
                                    @${escapeHtml(post.authorUsername || 'user')}
                                </p>
                            </div>
                        </a>

                        <!-- Type & Language Badges -->
                        <div class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded-md ${isLyrics ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-pink-500/10 text-pink-400 border-pink-500/20'} border text-[10px] font-bold uppercase">
                                ${escapeHtml(post.type || 'Shayari')}
                            </span>
                            <span class="px-2 py-0.5 rounded-md bg-gray-800 text-gray-300 text-[10px] font-semibold">
                                ${escapeHtml(post.category || 'General')}
                            </span>
                        </div>
                    </div>

                    <!-- Lyrics Song & Artist Banner (If type === Lyrics) -->
                    ${isLyrics ? `
                        <div class="mb-2.5 p-2.5 rounded-xl bg-purple-950/30 border border-purple-500/20 flex items-center justify-between text-xs">
                            <span class="text-purple-300 font-bold truncate"><i class="fa-solid fa-music mr-1"></i> ${escapeHtml(post.songName || '')}</span>
                            <span class="text-gray-400 text-[11px] truncate ml-2"><i class="fa-solid fa-microphone mr-1"></i> ${escapeHtml(post.artistName || '')}</span>
                        </div>
                    ` : ''}

                    <!-- Content Text Body -->
                    <a href="details.html?id=${post.contentId}" class="block my-2.5">
                        <p class="text-xs sm:text-sm text-gray-200 leading-relaxed font-normal line-clamp-3">
                            ${escapeHtml(post.text || '')}
                        </p>
                    </a>

                    <!-- Footer Action Bar -->
                    <div class="pt-3 mt-2 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                        <div class="flex items-center gap-3">
                            <!-- Love Button -->
                            <button onclick="toggleLoveReaction('${post.contentId}')" id="love-btn-${post.contentId}" class="flex items-center gap-1 hover:text-pink-500 active:scale-90">
                                <i id="love-icon-${post.contentId}" class="fa-regular fa-heart"></i>
                                <span id="love-count-${post.contentId}">${post.loveCount || 0}</span>
                            </button>

                            <!-- Comment Count -->
                            <a href="details.html?id=${post.contentId}" class="flex items-center gap-1 hover:text-purple-400">
                                <i class="fa-regular fa-comment"></i>
                                <span>${post.commentCount || 0}</span>
                            </a>

                            <!-- Views Count -->
                            <div class="flex items-center gap-1 text-gray-500">
                                <i class="fa-regular fa-eye"></i>
                                <span>${post.views || 0}</span>
                            </div>
                        </div>

                        <!-- Action Controls: Share, Saved, View -->
                        <div class="flex items-center gap-2">
                            <button onclick="shareFavoritePost('${post.contentId}', '${escapeJsString(post.text)}')" class="p-1.5 hover:text-white" title="Share">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>

                            <!-- Unfavorite Button -->
                            <button onclick="removeFavoriteItem('${post.contentId}')" class="px-2.5 py-1 rounded-lg bg-pink-500/10 hover:bg-pink-500 text-pink-400 hover:text-white font-bold text-xs border border-pink-500/30 transition-all flex items-center gap-1" title="Remove Favorite">
                                <i class="fa-solid fa-bookmark"></i> Saved
                            </button>

                            <!-- View Details -->
                            <a href="details.html?id=${post.contentId}" class="btn-gradient px-3 py-1 rounded-lg text-white font-bold text-xs shadow">
                                📖 View
                            </a>
                        </div>
                    </div>
                `;

                feedContainer.appendChild(card);

                // Sync Reaction State
                checkUserLoveState(post.contentId);
            });
        }

        // =============================================================
        // 6. REMOVE FAVORITE LOGIC
        // =============================================================
        function removeFavoriteItem(contentId) {
            if (!currentUser || !db) return;

            db.ref(`favorites/${currentUser.uid}/${contentId}`).remove().then(() => {
                showToast("Favorites থেকে সরানো হয়েছে");

                // Immediate DOM Removal with smooth animation
                const cardEl = document.getElementById(`fav-card-${contentId}`);
                if (cardEl) {
                    cardEl.style.transform = 'scale(0.95)';
                    cardEl.style.opacity = '0';
                    setTimeout(() => {
                        cardEl.remove();
                    }, 200);
                }
            }).catch(err => {
                console.error("Error removing favorite:", err);
            });
        }

        // =============================================================
        // 7. REALTIME LOVE REACTION TOGGLE
        // =============================================================
        function checkUserLoveState(contentId) {
            if (!currentUser || !db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            reactionRef.on('value', (snapshot) => {
                const icon = document.getElementById(`love-icon-${contentId}`);
                const btn = document.getElementById(`love-btn-${contentId}`);

                if (snapshot.exists() && snapshot.val()) {
                    if (icon) icon.className = "fa-solid fa-heart text-pink-500 animate-bounce";
                    if (btn) btn.classList.add('text-pink-500');
                } else {
                    if (icon) icon.className = "fa-regular fa-heart";
                    if (btn) btn.classList.remove('text-pink-500');
                }
            });
        }

        function toggleLoveReaction(contentId) {
            if (!currentUser) return;
            if (!db) return;

            const reactionRef = db.ref(`reactions/${contentId}/${currentUser.uid}`);
            const contentLoveRef = db.ref(`content/${contentId}/loveCount`);

            reactionRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    reactionRef.remove();
                    contentLoveRef.transaction(count => Math.max(0, (count || 1) - 1));
                } else {
                    reactionRef.set(true);
                    contentLoveRef.transaction(count => (count || 0) + 1);
                }
            });
        }

        // Share Action
        function shareFavoritePost(contentId, text) {
            const shareUrl = `${window.location.origin}/details.html?id=${contentId}`;

            if (navigator.share) {
                navigator.share({
                    title: 'ShayariVerse Favorite',
                    text: text ? `"${text.substring(0, 80)}..."` : 'Check out this post on ShayariVerse!',
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('লিংক কপি হয়েছে');
                });
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // Helper Functions
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJsString(str) {
            if (!str) return '';
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }
    </script>
